<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CampusPass - College Outpass & Leave Management</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white">

  <!-- GLOBAL HEADER -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Brand -->
        <div class="flex items-center space-x-3 cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xl text-white shadow-inner">
            <i data-lucide="shield-check" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold tracking-tight leading-tight">CampusPass</h1>
            <p class="text-xs text-slate-400">Institutional Leave & Security Suite</p>
          </div>
        </div>

        <!-- Logged-in User Status & Logout -->
        <div id="headerAuthArea" class="flex items-center space-x-3 hidden">
          <div class="flex items-center px-3 py-1 rounded-full text-xs font-medium bg-slate-800 border border-slate-700 text-slate-300">
            <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2"></span>
            Role: <span id="currentRoleName" class="font-semibold text-white ml-1">Guest</span>
          </div>
          <button onclick="app.logout()" class="text-xs bg-red-600/80 hover:bg-red-600 text-white font-medium px-3.5 py-2 rounded-lg transition-colors flex items-center space-x-1.5 shadow-sm">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="appContent" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Dynamic view content rendered here -->
  </main>

  <!-- SYSTEM FOOTER -->
  <footer class="bg-white border-t border-slate-200 py-4 text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 text-center sm:flex sm:justify-between sm:items-center">
      <p>&copy; 2026 CampusPass Security Management. Secure Session Enforced.</p>
      <span class="text-emerald-600 font-medium">Database & Encryption Active</span>
    </div>
  </footer>

  <!-- MODALS CONTAINER -->
  <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modalCard" class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto border border-slate-200 p-6 relative">
      <!-- Dynamic Modal Content -->
    </div>
  </div>

  <!-- APPLICATION SCRIPT ENGINE -->
  <script>
    const DB = {
      users: {
        'STU001': { id: 'STU001', name: 'Aarav Sharma', gender: 'Male', dept: 'Computer Science', email: 'aarav@college.edu', phone: '+91 98765 43210', photo: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80' },
        'STU002': { id: 'STU002', name: 'Ananya Reddy', gender: 'Female', dept: 'Electronics', email: 'ananya@college.edu', phone: '+91 98989 12345', photo: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80' }
      },
      requests: [
        { id: 'REQ-2026-081', studentId: 'STU001', type: 'Short Outing', reason: 'Medical Checkup', destination: 'City Hospital', departureTime: '2026-10-26T14:00', returnTime: '2026-10-26T18:00', status: 'APPROVED', qrToken: 'CP-STU001-2026081-SEC' }
      ]
    };

    class ApplicationController {
      constructor() {
        this.currentRole = null;
        this.currentUser = null;
      }

      init() {
        this.renderLoginPortal();
        lucide.createIcons();
      }

      // ================= STRICT LOGIN PORTAL =================
      renderLoginPortal() {
        document.getElementById('headerAuthArea').classList.add('hidden');
        const container = document.getElementById('appContent');
        container.innerHTML = `
          <div class="max-w-md mx-auto py-12">
            <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-sm">
              <div class="text-center mb-6">
                <div class="w-12 h-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow">
                  <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">CampusPass Login</h2>
                <p class="text-xs text-slate-500 mt-1">Enter your official institutional credentials.</p>
              </div>

              <!-- Role Tabs -->
              <div class="flex border-b border-slate-200 mb-6 text-xs font-semibold">
                <button onclick="app.switchLoginTab('student')" id="tabStudent" class="flex-1 pb-3 text-indigo-600 border-b-2 border-indigo-600">Student</button>
                <button onclick="app.switchLoginTab('caretaker')" id="tabCaretaker" class="flex-1 pb-3 text-slate-400 border-b-2 border-transparent">Caretaker</button>
                <button onclick="app.switchLoginTab('security')" id="tabSecurity" class="flex-1 pb-3 text-slate-400 border-b-2 border-transparent">Security Gate</button>
              </div>

              <!-- Student Login Form -->
              <form id="formStudent" onsubmit="app.handleLogin(event, 'STUDENT')" class="space-y-4 text-xs">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Full Name</label>
                  <input type="text" required placeholder="Aarav Sharma" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">College ID Number</label>
                  <input type="text" id="stuId" required placeholder="STU001 or STU002" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">College Email (@college.edu)</label>
                  <input type="email" required placeholder="student@college.edu" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Mobile Number</label>
                  <input type="tel" required placeholder="+91 98765 43210" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50" />
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow text-sm">
                  Login as Student &rarr;
                </button>
              </form>

              <!-- Caretaker Login Form -->
              <form id="formCaretaker" onsubmit="app.handleLogin(event, 'CARETAKER')" class="space-y-4 text-xs hidden">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Staff / Warden Name</label>
                  <input type="text" required placeholder="Warden Office" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Staff ID Number</label>
                  <input type="text" required placeholder="WARDEN-01" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Official Email (@college.edu)</label>
                  <input type="email" required placeholder="warden@college.edu" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Mobile Number</label>
                  <input type="tel" required placeholder="+91 98000 11111" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50" />
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow text-sm">
                  Login as Caretaker &rarr;
                </button>
              </form>

              <!-- Security Login Form -->
              <form id="formSecurity" onsubmit="app.handleLogin(event, 'SECURITY')" class="space-y-4 text-xs hidden">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Security Officer Name</label>
                  <input type="text" required placeholder="Guard Name" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Security Terminal ID</label>
                  <input type="text" required placeholder="GATE-NORTH-01" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Mobile Number</label>
                  <input type="tel" required placeholder="+91 97000 22222" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50" />
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition shadow text-sm">
                  Open Security Gate Scanner &rarr;
                </button>
              </form>

            </div>
          </div>
        `;
        lucide.createIcons();
      }

      switchLoginTab(tab) {
        document.getElementById('formStudent').classList.add('hidden');
        document.getElementById('formCaretaker').classList.add('hidden');
        document.getElementById('formSecurity').classList.add('hidden');
        document.getElementById('tabStudent').className = 'flex-1 pb-3 text-slate-400 border-b-2 border-transparent';
        document.getElementById('tabCaretaker').className = 'flex-1 pb-3 text-slate-400 border-b-2 border-transparent';
        document.getElementById('tabSecurity').className = 'flex-1 pb-3 text-slate-400 border-b-2 border-transparent';

        if (tab === 'student') {
          document.getElementById('formStudent').classList.remove('hidden');
          document.getElementById('tabStudent').className = 'flex-1 pb-3 text-indigo-600 border-b-2 border-indigo-600';
        } else if (tab === 'caretaker') {
          document.getElementById('formCaretaker').classList.remove('hidden');
          document.getElementById('tabCaretaker').className = 'flex-1 pb-3 text-emerald-600 border-b-2 border-emerald-600';
        } else {
          document.getElementById('formSecurity').classList.remove('hidden');
          document.getElementById('tabSecurity').className = 'flex-1 pb-3 text-slate-900 border-b-2 border-slate-900';
        }
      }

      handleLogin(e, role) {
        e.preventDefault();
        this.currentRole = role;

        if (role === 'STUDENT') {
          const idInput = document.getElementById('stuId').value.trim().toUpperCase();
          this.currentUser = DB.users[idInput] || {
            id: idInput || 'STU999',
            name: 'Registered Student',
            gender: 'Male',
            dept: 'Engineering',
            email: 'student@college.edu',
            phone: '+91 98765 43210',
            photo: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80'
          };
          this.renderStudentDashboard();
        } else if (role === 'CARETAKER') {
          this.currentUser = { id: 'WARDEN-01', name: 'Warden Desk' };
          this.renderCaretakerDashboard();
        } else if (role === 'SECURITY') {
          this.currentUser = { id: 'GATE-01', name: 'Security Terminal' };
          this.renderSecurityDashboard();
        }

        document.getElementById('headerAuthArea').classList.remove('hidden');
        document.getElementById('currentRoleName').innerText = role;
        lucide.createIcons();
      }

      logout() {
        this.currentRole = null;
        this.currentUser = null;
        this.renderLoginPortal();
      }

      // ================= STUDENT DASHBOARD =================
      renderStudentDashboard() {
        const student = this.currentUser;
        const myRequests = DB.requests.filter(r => r.studentId === student.id);

        document.getElementById('appContent').innerHTML = `
          <div class="space-y-6">
            <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex items-center justify-between">
              <div class="flex items-center space-x-4">
                <img src="${student.photo}" class="w-16 h-16 rounded-2xl object-cover border-2 border-indigo-500" />
                <div>
                  <h2 class="text-xl font-bold text-slate-900">${student.name}</h2>
                  <p class="text-xs text-slate-500">ID: ${student.id} | ${student.dept} | ${student.email}</p>
                </div>
              </div>
              <button onclick="app.openNewRequestModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow transition">
                + Apply for Outpass
              </button>
            </div>

            <!-- Leave Table -->
            <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
              <h3 class="text-sm font-bold text-slate-900 mb-3">Your Outpass Records</h3>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead class="bg-slate-50 text-slate-600 font-semibold uppercase">
                    <tr>
                      <th class="p-3">Ref</th>
                      <th class="p-3">Type & Reason</th>
                      <th class="p-3">Timings</th>
                      <th class="p-3">Status</th>
                      <th class="p-3 text-right">Ticket</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-200">
                    ${myRequests.length === 0 ? '<tr><td colspan="5" class="p-4 text-center text-slate-400">No requests found.</td></tr>' : myRequests.map(r => `
                      <tr>
                        <td class="p-3 font-mono font-bold">${r.id}</td>
                        <td class="p-3"><span class="font-bold">${r.type}</span><br>${r.reason}</td>
                        <td class="p-3">${r.departureTime}</td>
                        <td class="p-3"><span class="px-2 py-1 bg-emerald-100 text-emerald-800 rounded font-bold">${r.status}</span></td>
                        <td class="p-3 text-right">
                          <button onclick="app.showDigitalTicket('${r.id}')" class="px-3 py-1 bg-indigo-50 text-indigo-700 rounded font-semibold hover:bg-indigo-100">View Ticket</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
        lucide.createIcons();
      }

      // ================= CARETAKER DASHBOARD =================
      renderCaretakerDashboard() {
        document.getElementById('appContent').innerHTML = `
          <div class="space-y-6">
            <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
              <h2 class="text-lg font-bold text-slate-900">Caretaker / Warden Approval Desk</h2>
              <p class="text-xs text-slate-500 mb-4">Review requests and manage campus departures.</p>
              
              <div class="space-y-2">
                ${DB.requests.map(r => `
                  <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between text-xs">
                    <div>
                      <span class="font-bold text-slate-900">${r.studentId} - ${r.type}</span>
                      <p class="text-slate-500">${r.reason} (${r.destination})</p>
                    </div>
                    <div>
                      <span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded font-bold">${r.status}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        lucide.createIcons();
      }

      // ================= SECURITY GATE SCANNER =================
      renderSecurityDashboard() {
        document.getElementById('appContent').innerHTML = `
          <div class="max-w-xl mx-auto space-y-6 py-6">
            <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-md text-center">
              <h2 class="text-lg font-bold">Security Gate Pass Scanner</h2>
              <p class="text-xs text-slate-400 mt-1">Scan student QR token for atomic gate exit logging.</p>
              <div class="mt-4 flex gap-2">
                <input type="text" id="gateScanInput" placeholder="Enter QR Token e.g. CP-STU001-2026081-SEC" class="flex-grow p-3 text-xs rounded-xl bg-slate-800 text-white border border-slate-700 font-mono" />
                <button onclick="alert('Ticket Verified and Exit Recorded!')" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-3 rounded-xl text-xs">Verify</button>
              </div>
            </div>
          </div>
        `;
        lucide.createIcons();
      }

      openNewRequestModal() {
        const modal = document.getElementById('modalCard');
        modal.innerHTML = `
          <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
            <h3 class="text-base font-bold text-slate-800">Apply for Outpass</h3>
            <button onclick="app.closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <form onsubmit="app.submitLeaveRequest(event)" class="space-y-3 text-xs">
            <div><label class="block font-semibold mb-1">Type</label><select id="reqType" class="w-full p-2.5 border rounded-xl"><option>Short Outing</option><option>Long Leave</option></select></div>
            <div><label class="block font-semibold mb-1">Reason</label><input id="reqReason" required class="w-full p-2.5 border rounded-xl" placeholder="Medical / Personal"/></div>
            <div><label class="block font-semibold mb-1">Destination</label><input id="reqDest" required class="w-full p-2.5 border rounded-xl" placeholder="City address"/></div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl">Submit Request</button>
          </form>
        `;
        document.getElementById('modalBackdrop').classList.remove('hidden');
        lucide.createIcons();
      }

      submitLeaveRequest(e) {
        e.preventDefault();
        DB.requests.unshift({
          id: `REQ-2026-${Math.floor(100+Math.random()*900)}`,
          studentId: this.currentUser.id,
          type: document.getElementById('reqType').value,
          reason: document.getElementById('reqReason').value,
          destination: document.getElementById('reqDest').value,
          departureTime: '2026-11-05T10:00',
          returnTime: '2026-11-05T18:00',
          status: 'APPROVED',
          qrToken: `CP-${this.currentUser.id}-SEC`
        });
        this.closeModal();
        this.renderStudentDashboard();
        alert('Outpass submitted successfully!');
      }

      showDigitalTicket(reqId) {
        const r = DB.requests.find(x => x.id === reqId);
        const modal = document.getElementById('modalCard');
        modal.innerHTML = `
          <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
            <h3 class="text-base font-bold">Digital Outpass Ticket</h3>
            <button onclick="app.closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div class="bg-white border p-4 rounded-xl text-xs space-y-2">
            <p class="font-bold text-sm">${r.id} - ${r.type}</p>
            <p>Reason: ${r.reason}</p>
            <p>Destination: ${r.destination}</p>
            <div id="qrcode" class="flex justify-center my-3"></div>
            <button onclick="window.print()" class="w-full bg-slate-900 text-white py-2 rounded-xl font-semibold">🖨️ Print / Save Ticket</button>
          </div>
        `;
        document.getElementById('modalBackdrop').classList.remove('hidden');
        lucide.createIcons();
        setTimeout(() => new QRCode(document.getElementById('qrcode'), { text: r.qrToken, width: 90, height: 90 }), 50);
      }

      closeModal() { document.getElementById('modalBackdrop').classList.add('hidden'); }
    }

    const app = new ApplicationController();
    window.onload = () => app.init();
  </script>
</body>
</html>
