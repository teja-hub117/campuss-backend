/* Viewer-frame shims: no alert() dialogs, and external images are blocked. */
(function () {
  var host;
  window.alert = function (msg) {
    if (!host) {
      host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;z-index:100;pointer-events:none;padding:0 16px';
      document.body.appendChild(host);
    }
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'background:#0f172a;color:#fff;font-size:13px;font-weight:500;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.3);max-width:420px;border:1px solid #334155';
    host.appendChild(t);
    setTimeout(function () { t.remove(); }, 3500);
  };
  document.addEventListener('error', function (e) {
    var el = e.target;
    if (!el || el.tagName !== 'IMG' || el.dataset.fallback) return;
    el.dataset.fallback = '1';
    var name = (el.getAttribute('alt') || '?').trim();
    var ini = name.split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase() || '?';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="96" height="96" fill="#e0e7ff"/><text x="48" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#4338ca" text-anchor="middle">' + ini + '</text></svg>';
    el.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }, true);
})();
</script>

            <div>
              <label class="block font-semibold text-slate-700 mb-1">Destination Address</label>
              <input id="reqDest" type="text" required placeholder="Full destination address" class="w-full p-2.5 rounded-xl border border-slate-300 bg-slate-50 text-sm focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Gate Out Date & Time</label>
                <input id="reqOut" type="datetime-local" required class="w-full p-2.5 rounded-xl border border-slate-300 bg-slate-50 text-sm focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Expected Gate In Date & Time</label>
                <input id="reqIn" type="datetime-local" required class="w-full p-2.5 rounded-xl border border-slate-300 bg-slate-50 text-sm focus:ring-2 focus:ring-indigo-500" />
              </div>
            </div>

            <div class="p-3 bg-amber-50 border border-amber-200 text-amber-900 rounded-xl text-[11px]">
              <i data-lucide="alert-triangle" class="w-3.5 h-3.5 inline mr-1 text-amber-600"></i>
              Requests submitted for long leaves require 30-day advance filing. Standard leaves require 15-day filing.
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition text-sm shadow">
              Submit Leave Request &rarr;
            </button>
          </form>
        `;
        document.getElementById('modalBackdrop').classList.remove('hidden');
        lucide.createIcons();
      }

      submitLeaveRequest(e) {
        e.preventDefault();
        const type = document.getElementById('reqType').value;
        const reason = document.getElementById('reqReason').value;
        const destination = document.getElementById('reqDest').value;
        const departureTime = document.getElementById('reqOut').value;
        const returnTime = document.getElementById('reqIn').value;

        const student = this.currentUser;
        const needsVideoCall = student.gender === 'Female';

        const newReq = {
          id: `REQ-2026-${Math.floor(100 + Math.random() * 900)}`,
          studentId: student.id,
          type: type,
          reason: reason,
          destination: destination,
          departureTime: departureTime,
          returnTime: returnTime,
          status: needsVideoCall ? 'VERIFICATION_REQUIRED' : 'SUBMITTED',
          caretakerVideoVerified: false,
          rejectionReason: null,
          exitTime: null,
          returnTimeActual: null,
          qrToken: `CP-${student.id}-${Date.now().toString().slice(-4)}-SEC`,
          appliedOn: new Date().toISOString()
        };

        DB.requests.unshift(newReq);
        this.closeModal();
        this.renderStudentDashboard();
        alert(`Leave Request ${newReq.id} submitted successfully!`);
      }

      openVideoVerificationModal(reqId) {
        const req = DB.requests.find(r => r.id === reqId);
        const student = DB.users[req.studentId];

        const modal = document.getElementById('modalCard');
        modal.innerHTML = `
          <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
            <h3 class="text-base font-bold text-slate-800 flex items-center">
              <i data-lucide="video" class="w-5 h-5 mr-2 text-pink-600"></i> Caretaker Video Call Desk
            </h3>
            <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <div class="space-y-4 text-center">
            <!-- Simulated Video Call Container -->
            <div class="relative bg-slate-900 rounded-2xl overflow-hidden aspect-video flex items-center justify-center border-2 border-slate-700">
              <img src="${student.photo}" class="absolute inset-0 w-full h-full object-cover opacity-60" />
              <div class="relative z-10 text-white bg-slate-950/70 p-4 rounded-xl backdrop-blur-sm border border-slate-800">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-ping inline-block mr-2"></div>
                <span class="font-semibold text-xs">Video Feed Connected - Visual Verification In Progress</span>
                <p class="text-[11px] text-slate-400 mt-1">Verifying identity of ${student.name} (${student.id})</p>
              </div>
            </div>

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs text-left space-y-1">
              <p><span class="font-bold text-slate-800">Reason:</span> ${req.reason}</p>
              <p><span class="font-bold text-slate-800">Destination:</span> ${req.destination}</p>
            </div>

            <button onclick="app.confirmVideoVerification('${req.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition text-sm shadow flex items-center justify-center">
              <i data-lucide="check-circle" class="w-4 h-4 mr-2"></i> Confirm Visual Proof & Approve Call
            </button>
          </div>
        `;
        document.getElementById('modalBackdrop').classList.remove('hidden');
        lucide.createIcons();
      }

      confirmVideoVerification(reqId) {
        const req = DB.requests.find(r => r.id === reqId);
        if (req) {
          req.caretakerVideoVerified = true;
          req.status = 'APPROVED';
          DB.auditLogs.unshift({
            id: Date.now(),
            timestamp: new Date().toLocaleString(),
            user: 'Caretaker Desk',
            action: 'Video Verification Passed',
            details: `Visual identity confirmed for ${req.studentId} on ${req.id}`
          });
        }
        this.closeModal();
        this.renderCaretakerDashboard();
        alert('Video verification completed and request approved!');
      }

      approveRequest(reqId) {
        const req = DB.requests.find(r => r.id === reqId);
        if (req) {
          const student = DB.users[req.studentId];
          if (student.gender === 'Female' && !req.caretakerVideoVerified) {
            alert('Cannot approve! Mandatory caretaker video call verification is required for female students.');
            return;
          }
          req.status = 'APPROVED';
        }
        this.renderCaretakerDashboard();
      }

      openRejectModal(reqId) {
        const modal = document.getElementById('modalCard');
        modal.innerHTML = `
          <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
            <h3 class="text-base font-bold text-red-600 flex items-center">
              <i data-lucide="x-circle" class="w-5 h-5 mr-2"></i> Reject Outpass Request
            </h3>
            <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <div class="space-y-4 text-xs">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Mandatory Validation Reason for Rejection</label>
              <textarea id="rejectReason" required rows="3" placeholder="Provide clear policy or timing reason for rejection..." class="w-full p-2.5 rounded-xl border border-slate-300 bg-slate-50 text-sm focus:ring-2 focus:ring-red-500"></textarea>
            </div>

            <button onclick="app.confirmRejection('${reqId}')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition text-sm shadow">
              Confirm Rejection & Notify Student
            </button>
          </div>
        `;
        document.getElementById('modalBackdrop').classList.remove('hidden');
        lucide.createIcons();
      }

      confirmRejection(reqId) {
        const reason = document.getElementById('rejectReason').value;
        if (!reason || reason.trim() === '') {
          alert('Rejection reason is mandatory.');
          return;
        }
        const req = DB.requests.find(r => r.id === reqId);
        if (req) {
          req.status = 'REJECTED';
          req.rejectionReason = reason;
        }
        this.closeModal();
        this.renderCaretakerDashboard();
      }

      triggerParentCall(parentName, parentPhone) {
        alert(`Simulating Phone Call Shortcut to ${parentName} (${parentPhone})... Dialing line connected.`);
      }

      showDigitalTicket(reqId) {
        const req = DB.requests.find(r => r.id === reqId);
        const student = DB.users[req.studentId];

        const modal = document.getElementById('modalCard');
        modal.innerHTML = `
          <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
            <h3 class="text-base font-bold text-slate-800">Digital Gate Pass Ticket</h3>
            <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <!-- Railway/Movie Ticket Inspired Card -->
          <div class="bg-white border border-slate-300 rounded-2xl overflow-hidden shadow-lg p-5 relative">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
              <div>
                <h4 class="font-extrabold text-indigo-900 text-sm tracking-wide">CAMPUS OFFICIAL OUTPASS</h4>
                <p class="text-[10px] text-slate-500">Token Ref: ${req.qrToken}</p>
              </div>
              <span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 font-bold rounded text-[10px]">VALID PASS</span>
            </div>

            <div class="flex items-center space-x-4 mb-4">
              <img src="${student.photo}" class="w-16 h-16 rounded-xl object-cover border border-slate-300" />
              <div class="text-xs space-y-0.5">
                <p class="font-bold text-slate-900 text-sm">${student.name}</p>
                <p class="text-slate-600">ID: ${student.id} | ${student.gender}</p>
                <p class="text-slate-500 text-[11px]">${student.dept}</p>
              </div>
            </div>

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs grid grid-cols-2 gap-2 mb-4">
              <div>
                <span class="text-slate-400 block text-[10px]">DEPARTURE TIME</span>
                <span class="font-semibold text-slate-800">${req.departureTime.replace('T', ' ')}</span>
              </div>
              <div>
                <span class="text-slate-400 block text-[10px]">EXPECTED RETURN</span>
                <span class="font-semibold text-slate-800">${req.returnTime.replace('T', ' ')}</span>
              </div>
            </div>

            <!-- QR Container -->
            <div class="flex flex-col items-center justify-center p-3 bg-slate-900 rounded-xl text-white text-center">
              <div id="qrcode" class="p-2 bg-white rounded-lg mb-2"></div>
              <p class="font-mono text-[10px] text-slate-300">${req.qrToken}</p>
              <p class="text-[9px] text-slate-400 mt-0.5">Cryptographically Verified Security QR</p>
            </div>
          </div>
        `;
        document.getElementById('modalBackdrop').classList.remove('hidden');
        lucide.createIcons();

        // Render QR Code inside modal
        setTimeout(() => {
          new QRCode(document.getElementById('qrcode'), {
            text: req.qrToken,
            width: 100,
            height: 100
          });
        }, 50);
      }

      verifyGatePass(token) {
        const req = DB.requests.find(r => r.qrToken === token || r.id === token);
        const container = document.getElementById('scanResultContainer');
        container.classList.remove('hidden');

        if (!req) {
          container.innerHTML = `
            <div class="p-4 bg-red-50 border border-red-200 rounded-xl text-red-800 text-xs flex items-start space-x-3">
              <i data-lucide="x-circle" class="w-5 h-5 text-red-600 flex-shrink-0"></i>
              <div>
                <p class="font-bold text-sm">INVALID TICKET - ACCESS DENIED</p>
                <p class="mt-0.5">No valid outpass matching token '${token}' was found in backend records.</p>
              </div>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        const student = DB.users[req.studentId];

        if (req.status === 'EXITED') {
          container.innerHTML = `
            <div class="p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-900 text-xs space-y-3">
              <div class="flex items-center space-x-2 font-bold text-sm">
                <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600"></i>
                <span>EXIT ALREADY RECORDED - RECORD ENTRY BACK TO CAMPUS?</span>
              </div>
              <p>Student exit was logged at ${req.exitTime}. Scan to log student return.</p>
              <button onclick="app.recordGateReturn('${req.id}')" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs shadow">
                Log Student Return to Campus &rarr;
              </button>
            </div>
          `;
        } else if (req.status === 'APPROVED') {
          container.innerHTML = `
            <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-900 text-xs space-y-3">
              <div class="flex items-center space-x-3">
                <img src="${student.photo}" class="w-12 h-12 rounded-xl object-cover border border-emerald-300" />
                <div>
                  <p class="font-extrabold text-sm text-emerald-950">VALID OUTPASS - READY FOR EXIT</p>
                  <p class="font-bold text-slate-800">${student.name} (${student.id})</p>
                  <p class="text-slate-600 text-[11px]">${req.type} | ${req.destination}</p>
                </div>
              </div>

              <button onclick="app.recordGateExit('${req.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">
                Confirm & Log Gate Exit &rarr;
              </button>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="p-4 bg-red-50 border border-red-200 rounded-xl text-red-800 text-xs">
              <p class="font-bold">STATUS INVALID: ${req.status}</p>
              <p class="mt-1">This request has not received warden approval yet.</p>
            </div>
          `;
        }
        lucide.createIcons();
      }

      recordGateExit(reqId) {
        const req = DB.requests.find(r => r.id === reqId);
        if (req) {
          req.status = 'EXITED';
          req.exitTime = new Date().toLocaleString();
          alert(`Gate Exit Logged for ${req.studentId} at ${req.exitTime}`);
        }
        this.renderSecurityDashboard();
      }

      recordGateReturn(reqId) {
        const req = DB.requests.find(r => r.id === reqId);
        if (req) {
          req.status = 'COMPLETED';
          req.returnTimeActual = new Date().toLocaleString();
          alert(`Student Entry/Return Logged for ${req.studentId}`);
        }
        this.renderSecurityDashboard();
      }

      openFirstTimeRegistrationModal() {
        const modal = document.getElementById('modalCard');
        modal.innerHTML = `
          <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
            <h3 class="text-base font-bold text-slate-800">First-Time Photo Registration</h3>
            <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <div class="space-y-4 text-center">
            <div class="w-full h-48 bg-slate-900 rounded-2xl flex items-center justify-center text-slate-400 border border-slate-700 relative overflow-hidden">
              <i data-lucide="camera" class="w-10 h-10"></i>
              <span class="absolute bottom-3 text-xs text-slate-300">Live Camera Stream Simulated</span>
            </div>
            
            <p class="text-xs text-slate-500">
              Capturing verified portrait photo to link with student record ${this.currentUser.id}.
            </p>

            <button onclick="app.closeModal(); alert('Photo captured and securely saved in identity database!');" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">
              Capture & Save Photo
            </button>
          </div>
        `;
        document.getElementById('modalBackdrop').classList.remove('hidden');
        lucide.createIcons();
      }

      showAuditLogs() {
        const modal = document.getElementById('modalCard');
        modal.innerHTML = `
          <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
            <h3 class="text-base font-bold text-slate-800">System Security Audit Logs</h3>
            <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <div class="space-y-2 text-xs max-h-96 overflow-y-auto custom-scrollbar">
            ${DB.auditLogs.map(log => `
              <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-0.5">
                <div class="flex items-center justify-between font-bold text-slate-800">
                  <span>${log.action}</span>
                  <span class="text-[10px] text-slate-400 font-normal">${log.timestamp}</span>
                </div>
                <p class="text-slate-600">${log.details}</p>
                <p class="text-[10px] text-indigo-600 font-semibold">User: ${log.user}</p>
              </div>
            `).join('')}
          </div>
        `;
        document.getElementById('modalBackdrop').classList.remove('hidden');
        lucide.createIcons();
      }

      showLiveTrackingModal(reqId) {
        this.setRole('PARENT');
      }

      getStatusBadge(status) {
        switch (status) {
          case 'APPROVED':
            return '<span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 font-bold rounded-md text-[11px]">APPROVED</span>';
          case 'REJECTED':
            return '<span class="px-2.5 py-1 bg-red-100 text-red-800 font-bold rounded-md text-[11px]">REJECTED</span>';
          case 'VERIFICATION_REQUIRED':
            return '<span class="px-2.5 py-1 bg-pink-100 text-pink-800 font-bold rounded-md text-[11px]">VIDEO VERIFICATION REQ.</span>';
          case 'EXITED':
            return '<span class="px-2.5 py-1 bg-indigo-100 text-indigo-800 font-bold rounded-md text-[11px]">EXITED CAMPUS</span>';
          case 'COMPLETED':
            return '<span class="px-2.5 py-1 bg-slate-100 text-slate-800 font-bold rounded-md text-[11px]">COMPLETED</span>';
          default:
            return '<span class="px-2.5 py-1 bg-amber-100 text-amber-800 font-bold rounded-md text-[11px]">SUBMITTED</span>';
        }
      }
    }

    // Launch App
    const app = new ApplicationController();
    window.onload = () => app.init();
  </script>

</body></html>
